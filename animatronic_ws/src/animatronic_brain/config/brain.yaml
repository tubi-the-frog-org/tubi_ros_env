/**:
  ros__parameters:
    # Single source of truth for snack data; shared with esp32_bridge and speech.
    snacks_config_path: "config/snacks.json"
    reload_poll_interval_s: 2.0

    # Providers are tried in this order until one decides. "local" (Ollama)
    # exists but is excluded by default -- see CLAUDE.md's cloud-LLM update.
    provider_chain: ["keyword", "cloud", "fallback"]

    # keyword: instant, no network.
    keyword_threshold: 1
    keyword_margin: 1

    # cloud: OpenAI-compatible, structured {"snack", "reply"} output.
    # LLM_API_KEY comes from the environment, never a param, never logged.
    cloud_enabled: true
    cloud_base_url: "https://api.openai.com/v1"
    cloud_model: "gpt-5-nano"
    cloud_timeout_s: 6.0
    cloud_temperature: 0.7
    # -1 means unlimited, matching the keep_alive convention below.
    cloud_daily_request_cap: 300
    cloud_total_request_cap: -1

    # local: optional Ollama fallback, off by default. Only picks the
    # snack -- the line is always pre-written, never LLM prose.
    local_enabled: false
    ollama_base_url: "http://localhost:11434"
    ollama_model: "qwen2.5:0.5b"
    ollama_timeout_s: 45.0
    ollama_num_predict: 16
    ollama_num_ctx: 1024
    ollama_keep_alive: -1
    # Diagnostics timer; also checks Ollama health when local_enabled is true.
    health_check_interval_s: 30.0
