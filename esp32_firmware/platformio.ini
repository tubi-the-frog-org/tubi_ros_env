; PlatformIO project for the ESP32 side of the wizard snack animatronic
; (servo control + later audio playback). Scope note: this repo's Pi-side
; ROS 2 task does not implement this firmware (see CLAUDE.md) — it's
; written against docs/esp32_protocol.md in a separate session. This file
; just reserves the project structure and a starting board config.

[env:esp32dev]
platform = espressif32
board = esp32dev          ; placeholder — set to your actual board (e.g. esp32-s3-devkitc-1)
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; lib_deps (e.g. ArduinoJson, a servo library) added once firmware
; implementation starts, per docs/esp32_protocol.md.
