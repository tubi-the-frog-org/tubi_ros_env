; Tubi on ONE ESP32 (DOIT DevKit V1): MP3 audio out of the DAC (GPIO25), the four servos, and
; both fed from the Raspberry Pi over a single UART2 link (GPIO16/17/18). See src/main.c.
[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = espidf
; UART0 (USB) is the console and a bench-test command port at 115200
monitor_speed = 115200
